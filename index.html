<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast</title>


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body class="min-h-screen bg-slate-900 text-white">


    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-8">


        <!-- Heading -->
        <h1 class="text-3xl sm:text-4xl font-bold text-center mb-8">

            Weather Forecast

        </h1>


        <!-- Error Message -->
        <p
            id="errorMessage"
            class="text-red-400 text-center mb-4"
            style="display: none;"
            role="alert">
        </p>


        <!-- Loading Message -->
        <p
            id="loadingMessage"
            class="text-blue-400 text-center mb-4"
            style="display: none;"
            role="status">
            Loading weather data...
        </p>


        <!-- Search Section -->
        <section
            class="flex justify-center gap-2 mb-4 flex-wrap"
            aria-label="Weather search">


            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                aria-label="Enter city name"
                class="w-full max-w-md px-4 py-3 rounded-lg text-black outline-none">


            <button
                id="searchBtn"
                aria-label="Search weather"
                class="w-full sm:w-auto px-6 py-3 bg-blue-500 rounded-lg font-semibold">

                Search

            </button>


            <button
                id="locationBtn"
                aria-label="Get weather for my current location"
                class="w-full sm:w-auto px-6 py-3 bg-green-500 rounded-lg font-semibold">

                My Location

            </button>

        </section>


        <!-- Recently Searched Cities -->
        <div
            id="recentSearchContainer"
            class="flex justify-center mb-8 hidden">

            <select
                id="recentCities"
                aria-label="Recently searched cities"
                class="px-4 py-3 rounded-lg text-black w-full max-w-md">

                <option value="">
                    Recently searched cities
                </option>

            </select>

        </div>


        <!-- Temperature Unit Toggle -->
        <div class="flex justify-center mb-4">

            <button
                id="unitToggle"
                aria-label="Change temperature unit"
                class="px-5 py-2 bg-purple-500 rounded-lg font-semibold">

                Switch to °F

            </button>

        </div>


        <!-- Current Weather -->
        <section
            class="bg-slate-800 rounded-2xl p-6 mb-8 text-center"
            aria-label="Current weather">


            <!-- City Name -->
            <h2
                id="cityName"
                class="text-2xl sm:text-3xl font-bold mb-4">

                Mumbai

            </h2>


            <!-- Dynamic Weather Icon -->
            <div class="mb-4">

                <img
                    id="weatherIcon"
                    src=""
                    alt="Current weather condition"
                    class="w-20 h-20 mx-auto">

            </div>


            <!-- Temperature -->
            <p
                id="temperature"
                class="text-4xl sm:text-5xl font-bold">

                28°C

            </p>


            <!-- Extreme Temperature Alert -->
            <p
                id="temperatureAlert"
                class="text-red-400 font-bold mt-3"
                style="display: none;"
                role="alert">

            </p>


            <!-- Weather Condition -->
            <p
                id="weatherCondition"
                class="text-lg sm:text-xl mt-2">

                Clear Sky

            </p>


            <!-- Weather Details -->
            <div
                class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-8">


                <!-- Humidity -->
                <div
                    class="bg-slate-700 rounded-xl p-4"
                    aria-label="Humidity">

                    <p class="text-2xl" aria-hidden="true">
                        💧
                    </p>

                    <p class="text-sm text-gray-300">
                        Humidity
                    </p>

                    <p id="humidity" class="font-bold">
                        65%
                    </p>

                </div>


                <!-- Wind -->
                <div
                    class="bg-slate-700 rounded-xl p-4"
                    aria-label="Wind speed">

                    <p class="text-2xl" aria-hidden="true">
                        💨
                    </p>

                    <p class="text-sm text-gray-300">
                        Wind
                    </p>

                    <p id="windSpeed" class="font-bold">
                        12 km/h
                    </p>

                </div>


                <!-- Feels Like -->
                <div
                    class="bg-slate-700 rounded-xl p-4"
                    aria-label="Feels like temperature">

                    <p class="text-2xl" aria-hidden="true">
                        🌡️
                    </p>

                    <p class="text-sm text-gray-300">
                        Feels Like
                    </p>

                    <p id="feelsLike" class="font-bold">
                        29°C
                    </p>

                </div>


            </div>

        </section>


        <!-- 5 Day Forecast -->
        <section aria-label="Five day weather forecast">


            <h2 class="text-xl sm:text-2xl font-bold mb-4">

                5 Day Forecast

            </h2>


            <!-- Forecast Cards -->
            <div
                id="forecastContainer"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">

            </div>


        </section>


    </main>


    <!-- JavaScript Files -->

    <!-- config.js must come BEFORE script.js -->

    <script src="config.js"></script>

    <script src="script.js"></script>


</body>

</html>
